<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f7f8fc;
        --surface: #ffffff;
        --text: #283044;
        --muted: #687188;
        --heading: #20283d;
        --accent: #5967c8;
        --accent-soft: #eef0ff;
        --border: #e5e8f1;
        --shadow: 0 12px 35px rgba(44, 55, 91, 0.07);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
          sans-serif;
        font-size: 16px;
        line-height: 1.8;
        letter-spacing: -0.01em;
      }

      main {
        width: min(100% - 32px, 780px);
        margin: 48px auto;
        padding: clamp(28px, 6vw, 64px);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      h1,
      h2,
      h3 {
        color: var(--heading);
        line-height: 1.35;
        letter-spacing: -0.04em;
      }

      h1 {
        margin: 0 0 32px;
        font-size: clamp(1.8rem, 4vw, 2.35rem);
      }

      h2 {
        margin: 40px 0 14px;
        font-size: 1.35rem;
      }

      h3 {
        margin: 28px 0 10px;
        font-size: 1.1rem;
      }

      p,
      ul,
      ol {
        margin: 0 0 20px;
      }

      a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      li + li {
        margin-top: 8px;
      }

      hr {
        margin: 36px 0;
        border: 0;
        border-top: 1px solid var(--border);
      }

      blockquote {
        margin: 24px 0;
        padding: 14px 20px;
        background: var(--accent-soft);
        border-left: 4px solid var(--accent);
        border-radius: 0 12px 12px 0;
        color: var(--muted);
      }

      code {
        padding: 2px 6px;
        background: #f1f3f8;
        border-radius: 6px;
        font-size: 0.9em;
      }

      table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px 14px;
        border: 1px solid var(--border);
        text-align: left;
      }

      th {
        background: #f7f8fc;
        color: var(--heading);
      }

      @media (max-width: 600px) {
        main {
          width: min(100% - 20px, 780px);
          margin: 10px auto;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
